<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in to ArtifactA</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #fafafa; color: #1a1a1a; font: 15px/1.5 system-ui, sans-serif; }
    .card { text-align: center; padding: 2.5rem; background: #fff; border: 1px solid #e5e5e5; border-radius: 10px; max-width: 360px; }
    .card h1 { margin: 0 0 0.5rem; font-size: 1.4rem; }
    .card p { margin: 0 0 1.5rem; color: #666; }
    .btn { display: inline-block; padding: 0.6rem 1.5rem; background: #0b62d6; color: #fff; text-decoration: none; border-radius: 6px; font-weight: 600; }
    .btn:hover { background: #0a55ba; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sign in to ArtifactA</h1>
    <p>Publish and view your artifacts. Sign in to continue.</p>
    <a class="btn" href="/login">Sign in</a>
  </div>
</body>
</html>
