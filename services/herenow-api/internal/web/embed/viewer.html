<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>here.now</title>
  <style>
    html, body { margin: 0; height: 100%; background: #fff; font: 14px system-ui, sans-serif; }
    #frame { border: 0; width: 100%; height: 100vh; display: block; }
    #msg { padding: 2rem; color: #444; }
  </style>
</head>
<body>
  <!-- v0 viewer: fetches the artifact bytes (server enforces authz on /raw) and
       renders them in a sandboxed, null-origin iframe. `allow-scripts` WITHOUT
       `allow-same-origin` isolates each artifact from the app and from other
       artifacts even under path-based routing. -->
  <iframe id="frame" sandbox="allow-scripts" referrerpolicy="no-referrer" hidden></iframe>
  <div id="msg">Loading…</div>
  <script>
    (async () => {
      const parts = location.pathname.split('/').filter(Boolean); // ["a", "<slug>"]
      const slug = parts[1] || '';
      const msg = document.getElementById('msg');
      const frame = document.getElementById('frame');
      try {
        const res = await fetch('/a/' + encodeURIComponent(slug) + '/raw', { credentials: 'same-origin' });
        if (!res.ok) {
          msg.textContent = res.status === 404
            ? 'This artifact is unavailable, or you do not have access.'
            : 'Could not load this artifact (' + res.status + ').';
          return;
        }
        frame.srcdoc = await res.text();
        frame.hidden = false;
        msg.remove();
      } catch (e) {
        msg.textContent = 'Could not load this artifact.';
      }
    })();
  </script>
</body>
</html>
